
spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/whats_next}
spring.datasource.username=${DB_USERNAME:whats_next_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.web.error.include-message=always
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

tmdb.api.key=${TMDB_API_KEY}
logging.level.org.springframework.security=TRACE

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/{registrationId}